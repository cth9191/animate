<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isometric demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #e6e6ea; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  ISOMETRIC DEMO — 9:16, 6.0s @ 120 BPM, 24fps. A laptop on a stacked plinth opens; a prompt is typed;
//  the dark cursor block becomes the front of a server blade, which slides out of a rack with the hero riding it.
//  Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <project>/styles/isometric/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const CX = 500;

const ERA_LIST = [[0, 3, () => sceneLaptop()], [3, 6, () => sceneRack()]];
const SHOTS = [
  ['laptop', 0, 0.0, 3.0, 'a laptop on a plinth opens; a prompt is typed'],
  ['rack',   1, 3.0, 6.0, 'the cursor becomes a server blade that slides out of the rack'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { plates: 0.05, laptop: 0.3, open: 0.5, keys: 0.8, type: 1.1, hop: 1.75, slide: 3.75, hop2: 5.0 },
  acts: [
    { name: '1 Laptop', role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Rack',   role: 'gift',  t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 2.2, title: 'the prompt is typed', sound: 'soft key clicks, a pluck', next: 'the cursor becomes a blade' },
    { t: 5.2, title: 'the blade slides out', sound: 'a calm pad, a slide', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
