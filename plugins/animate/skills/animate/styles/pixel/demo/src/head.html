<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0910; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  PIXEL DEMO — 9:16, 6.0s @ 120 BPM, 24fps. A 4-colour handheld forest at dusk (90x160); the hero spots the
//  moon, which becomes a spinning coin over a 16-colour arcade night (180x320), where it jumps for coins.
//  The resolution doubles at the morph: time told by sharpness. Proves the style kit renders, morphs, stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/pixel/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Segoe UI", "Helvetica Neue", Arial, sans-serif';   // only the storyboard sheet uses a system font
const CX = 470;

const ERA_LIST = [[0, 3, () => sceneDusk()], [3, 6, () => sceneArcade()]];
const SHOTS = [
  ['dusk',   0, 0.0, 3.0, 'a handheld forest at dusk: the hero spots the moon'],
  ['arcade', 1, 3.0, 6.0, 'the moon becomes a coin; the hero jumps for coins'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { spot: 1.0, hop: 2.0, jump1: 4.0, walk: 4.5, jump2: 5.0 },
  acts: [
    { name: '1 Dusk',   role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Arcade', role: 'gift',  t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 1.5, title: 'the hero spots the moon', sound: 'square arps, a blip', next: 'the moon becomes a coin' },
    { t: 4.25, title: 'jump for a coin', sound: 'jump sweep, coin ding', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
